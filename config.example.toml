# ------------------------------------------------------------------------------
# Binance USDT Perpetual Futures
# ------------------------------------------------------------------------------
[[exchanges]]
name = "binance"
market_type = "perpetual"

# WebSocket endpoint for Binance USDT Perpetual Futures
ws_endpoint = "wss://fstream.binance.com/stream"

# REST API endpoint for Binance Futures
rest_endpoint = "https://fapi.binance.com"

mode = "explicit"
symbols = ["BTCUSDT", "ETHUSDT", "BNBUSDT"]
symbol_refresh_interval_s = 0

# Futures-specific streams: aggTrade (aggregated trades), markPrice (funding rate)
streams = ["aggTrade", "depth", "kline", "markPrice"]
kline_intervals = ["1m", "5m"]

ws_connection_rate = 5

# Note: Binance Futures has lower stream limit than Spot
ws_streams_per_connection = 200
ws_max_connections = 300
ws_max_batch_size = 200
ws_subscription_delay_ms = 100

# ------------------------------------------------------------------------------
# Bybit Spot
# ------------------------------------------------------------------------------
[[exchanges]]
name = "bybit"
market_type = "spot"

# Bybit V5 WebSocket endpoint for Spot
ws_endpoint = "wss://stream.bybit.com/v5/public/spot"

# Bybit V5 REST API endpoint
rest_endpoint = "https://api.bybit.com"

mode = "explicit"
symbols = ["BTCUSDT", "ETHUSDT"]
symbol_refresh_interval_s = 0

# Bybit V5 stream types
# - publicTrade: Public trades
# - kline: Candlestick data
# - orderbook: Order book snapshots and updates
streams = ["publicTrade", "kline", "orderbook"]

# Bybit kline intervals: 1, 3, 5, 15, 30, 60, 120, 240, 360, 720, D, W, M
# Note: Numbers are in minutes, D=day, W=week, M=month
kline_intervals = ["1", "5", "60"]

# Bybit rate limits (more generous than Binance)
ws_connection_rate = 10  # 10 connections per minute
ws_streams_per_connection = 200  # Max 200 subscriptions per connection
ws_max_connections = 500  # 500 connections per IP
ws_max_batch_size = 10  # Bybit V5 max 10 topics per subscription
ws_subscription_delay_ms = 200  # Bybit may need higher delay

# ------------------------------------------------------------------------------
# Bybit USDT Perpetual
# ------------------------------------------------------------------------------
[[exchanges]]
name = "bybit"
market_type = "perpetual"

# Bybit V5 WebSocket endpoint for Linear (USDT Perpetual)
ws_endpoint = "wss://stream.bybit.com/v5/public/linear"

rest_endpoint = "https://api.bybit.com"

mode = "explicit"
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
symbol_refresh_interval_s = 0

streams = ["publicTrade", "kline", "orderbook"]
kline_intervals = ["1", "5"]

ws_connection_rate = 10
ws_streams_per_connection = 200
ws_max_connections = 500
ws_max_batch_size = 10
ws_subscription_delay_ms = 200

# ==============================================================================
# Configuration Notes
# ==============================================================================
#
# Stream Counting:
# ----------------
# - trade/depth/aggTrade/publicTrade: 1 stream per symbol
# - kline: N streams per symbol (one per interval)
# - markPrice: 1 stream (global, not per-symbol)
#
# Example: 5 symbols with ["trade", "kline"] and 3 intervals
# Total: 5 * (1 trade + 3 klines) = 20 streams
#
# Worker Calculation:
# ------------------
# Required workers = ceil(total_streams / streams_per_connection)
#
# Example: 2048 total streams, 1024 streams per connection
# Workers needed: ceil(2048 / 1024) = 2 workers
#
# S3 Data Layout:
# --------------
# Data is stored with Hive-style partitioning:
# {prefix}/exchange={exchange}/market_type={spot|perpetual}/stream_type={type}/
# symbol={symbol}/year={yyyy}/month={mm}/day={dd}/hour={hh}/{uuid}.ndjson.zst
#
# Example:
# production/exchange=binance/market_type=spot/stream_type=trade/
# symbol=BTCUSDT/year=2024/month=01/day=15/hour=10/
# a1b2c3d4-e5f6-7890-abcd-ef1234567890.ndjson.zst
#
# Performance Tuning:
# ------------------
# Low volume (< 100 msg/s):
#   batch_size=500, batch_timeout_ms=10000, upload_worker_count=2
#
# Medium volume (100-1000 msg/s):
#   batch_size=1000, batch_timeout_ms=5000, upload_worker_count=4
#
# High volume (> 1000 msg/s):
#   batch_size=2000, batch_timeout_ms=2000, upload_worker_count=8
#
# Security Best Practices:
# -----------------------
# 1. Use environment variables for credentials
# 2. Restrict S3 bucket permissions (principle of least privilege)
# 3. Use IAM roles instead of access keys when possible
# 4. Enable S3 bucket encryption
# 5. Enable S3 access logging for audit trail
#
# Multi-Instance Deployment:
# -------------------------
# For high availability and rate limit distribution:
# 1. Deploy 2-3 instances with identical configs
# 2. Use different S3 prefix for each instance (instance-1, instance-2)
# 3. Each instance gets separate rate limit quota
# 4. Query layer handles deduplication
#
# See docs/geo-distributed-deployment.md for detailed guide
