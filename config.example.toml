# Market Chronicle Configuration Example
# 
# This file contains a production-ready configuration example with all
# supported exchanges and detailed comments explaining each option.
#
# Copy this file to config.toml and adjust values for your deployment.

# ==============================================================================
# S3 Configuration
# ==============================================================================
[s3]
# S3-compatible endpoint URL
# - For AWS S3: "https://s3.amazonaws.com" or "https://s3.{region}.amazonaws.com"
# - For MinIO: "http://localhost:9000"
# - For LakeFS: "http://localhost:8000"
endpoint = "http://localhost:9000"

# S3 bucket name where market data will be stored
# Note: Bucket must exist before starting the service
bucket = "market-data"

# AWS region for the S3 bucket
region = "us-east-1"

# Top-level prefix for all S3 keys
# Use this to:
# - Separate environments (dev, staging, production)
# - Separate multiple service instances (instance-1, instance-2)
# - Enable easy data cleanup or migration
prefix = "production"

# S3 access credentials
# SECURITY: Consider using environment variables instead of hardcoding
# Example: access_key_id = "${AWS_ACCESS_KEY_ID}"
access_key_id = "minioadmin"
secret_access_key = "minioadmin"

# Number of parallel S3 upload workers
# - More workers = higher upload throughput
# - More workers = more memory usage
# 
# Options:
#   "auto" - Automatically compute based on expected partition count
#            Formula: partitions / partitions_per_worker, min 2, max 16
#            Recommended for most deployments
#   <number> - Manual worker count (e.g., 4, 8, 16)
#            Use when you need precise control
#
# Recommended: "auto" for most cases, or 4-8 for production
upload_worker_count = "auto"

# Partitions per worker ratio (only used when upload_worker_count = "auto")
# - Higher value = fewer workers (more partitions per worker)
# - Lower value = more workers (fewer partitions per worker)
# 
# Tune based on your workload:
#   75-100  - Default, works well for most workloads
#   50      - High volume, small batches, or slow S3
#   100-150 - Low volume, large batches, or fast S3
#
# Default: 75 (omit this line to use default)
# partitions_per_worker = 75

# Number of messages per batch before flushing to S3
# - Larger batches = fewer S3 uploads, better compression ratio
# - Smaller batches = lower latency, more S3 operations
# Recommended: 500-2000 depending on message rate
batch_size = 1000

# Maximum batch age in milliseconds before flushing to S3
# - Ensures low-volume symbols get uploaded regularly
# - Prevents indefinite waiting for partial batches
# Recommended: 3000-10000 ms
batch_timeout_ms = 5000

# zstd compression level (1-22)
# - Level 1-3: Fast compression, lower ratio (real-time streaming)
# - Level 4-9: Balanced compression and speed
# - Level 10-22: Maximum compression, very slow (archival)
# Recommended: 3 for real-time, 5 for balanced
compression_level = 3

# ==============================================================================
# Exchange Configurations
# ==============================================================================
# You can define multiple exchange configurations, each with different settings.
# Each configuration creates an independent data collection pipeline.

# ------------------------------------------------------------------------------
# Binance Spot - Explicit Symbol List
# ------------------------------------------------------------------------------
[[exchanges]]
name = "binance"
market_type = "spot"

# WebSocket endpoint for Binance Spot
ws_endpoint = "wss://stream.binance.com:9443/stream"

# REST API endpoint for symbol discovery (used in "all" mode)
rest_endpoint = "https://api.binance.com"

# Subscription mode:
# - "explicit": Subscribe only to symbols listed in 'symbols' array
# - "all": Fetch all available symbols via REST API and subscribe to all
mode = "explicit"

# Symbols to subscribe to (required when mode = "explicit")
# Must be uppercase, format: BASE + QUOTE (e.g., BTCUSDT, ETHBTC)
symbols = ["BTCUSDT", "ETHUSDT", "BNBUSDT", "ADAUSDT", "SOLUSDT"]

# Symbol refresh interval in seconds (only used when mode = "all")
# How often to fetch the symbol list from REST API to discover new symbols
# Set to 0 when mode = "explicit" (not used)
symbol_refresh_interval_s = 0

# Stream types to subscribe to for each symbol
# Available for Binance: trade, depth, kline, aggTrade, markPrice
streams = ["trade", "depth", "kline"]

# Kline (candlestick) intervals (required if "kline" is in streams)
# Available intervals: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M
kline_intervals = ["1m", "5m", "1h"]

# WebSocket connection rate limit (connections per minute)
# Binance limit: 5 connections per minute per IP
ws_connection_rate = 5

# Maximum streams per WebSocket connection
# Binance Spot limit: 1024 streams per connection
ws_streams_per_connection = 1024

# Maximum concurrent WebSocket connections per IP
# Binance limit: 300 connections per IP
ws_max_connections = 300

# Maximum streams per subscription message
# Binance typically allows up to 200 streams per subscribe request
ws_max_batch_size = 200

# Delay between subscription batches in milliseconds
# Prevents rate limiting when sending multiple subscription requests
# 0 = no delay, 100-200ms recommended for high-volume deployments
ws_subscription_delay_ms = 100

