[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Async trait
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# S3 client
aws-sdk-s3 = "1.13"
aws-config = "1.1"
aws-credential-types = "1.1"
aws-types = "1.1"

# Compression
zstd = "0.13"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Observability (OpenTelemetry)
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["tonic", "metrics"] }
opentelemetry-prometheus = "0.15"
prometheus = "0.13"
tracing-opentelemetry = "0.23"

# HTTP server for metrics
axum = "0.7"

# Rate limiting
governor = "0.6"

# UUID generation
uuid = { version = "1.21", features = ["v7", "serde"] }

# CLI parsing
clap = { version = "4.4", features = ["derive"] }

# Shared workspace crate
market-chronicle-core = { path = "crates/market-chronicle-core" }
