services:
  # replace with https://github.com/rustfs/rustfs
  # MinIO - S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: market-chronicle-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO initialization - create bucket and app access key
  minio-init:
    image: minio/mc:latest
    container_name: market-chronicle-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/market-archive --ignore-existing;
      mc admin user add myminio \"${MC_S3_ACCESS_KEY_ID}\" \"${MC_S3_SECRET_ACCESS_KEY}\" || echo 'MinIO user already exists, skipping';
      mc admin policy attach myminio readwrite --user \"${MC_S3_ACCESS_KEY_ID}\" || echo 'Policy already attached, skipping';
      echo 'MinIO bucket and access key created successfully';
      "

  
  # Prometheus - Metrics collection and monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: market-chronicle-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Metrics visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: market-chronicle-grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Loki - Log aggregation storage
  loki:
    image: grafana/loki:latest
    container_name: market-chronicle-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # Vector - High-performance log collection and routing
  vector:
    image: timberio/vector:latest-alpine
    container_name: market-chronicle-vector
    depends_on:
      - loki
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.toml"]
    ports:
      - "8686:8686" # Vector API
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8686/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Market Chronicle - Main service
  market-chronicle:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: market-chronicle
    depends_on:
      minio:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "9090:9090"
    environment:
      - RUST_LOG=info
      - MC_S3_ACCESS_KEY_ID=${MC_S3_ACCESS_KEY_ID}
      - MC_S3_SECRET_ACCESS_KEY=${MC_S3_SECRET_ACCESS_KEY}
    volumes:
      - ../config.docker.toml:/config/config.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
