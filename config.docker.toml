# Market Chronicle - Manual Testing Configuration
#
# This is a minimal configuration for local development and manual testing.
# Start the dev environment first: make setup-dev

[s3]
# MinIO instance (Docker internal network)
endpoint = "http://minio:9000"
bucket = "binance-data"
region = "us-east-1"
prefix = "main"

# MinIO default credentials
access_key_id = "minioadmin"
secret_access_key = "minioadmin"

# Small settings for quick testing
upload_worker_count = 4
batch_size = 10000              # Small batch size for quick flushing
batch_timeout_ms = 60000      # 60 seconds timeout
compression_level = 1        # Fast compression for testing

# ==============================================================================
# Test with a single symbol from Binance Spot
# ==============================================================================
[[exchanges]]
name = "binance"
market_type = "spot"
ws_endpoint = "wss://stream.binance.com:9443/stream"
rest_endpoint = "https://api.binance.com"

# Explicit mode with just BTC
mode = "all"
symbols = []
symbol_refresh_interval_s = 3600

# Just trade stream for simplicity
streams = ["trade", "depth", "kline"]
kline_intervals = ["1m"]

# Binance rate limits
ws_connection_rate = 5
ws_streams_per_connection = 400
ws_max_connections = 300
ws_max_batch_size = 200  # Maximum streams per subscription message
ws_subscription_delay_ms = 100  # Delay between subscription batches (milliseconds)
